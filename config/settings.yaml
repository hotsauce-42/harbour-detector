data:
  raw_glob: "data/raw/**/*.parquet"
  interim_dir: "data/interim"
  reference_dir: "data/reference"
  output_dir: "data/output"

# Column name mapping — adjust to match your actual Parquet schema
columns:
  mmsi: mmsi
  timestamp: timestamp
  lat: lat
  lon: lon
  sog: sog
  nav_status: nav_status
  msg_type: msg_type
  draught: draught
  destination: destination
  ship_type: ship_type

phase1:
  # Strategy A: nav_status filter
  moored_nav_statuses: [1, 5]       # 1=at anchor, 5=moored

  # Both strategies: low-speed threshold
  sog_threshold_knots: 0.5

  # Stop segment grouping
  max_gap_minutes: 15               # gap between messages that still belongs to same stop
  min_stop_duration_minutes: 30     # discard stops shorter than this
  min_messages_per_stop: 3          # discard stops with too few messages
  positional_variance_max_meters: 300  # discard stops where ship was still moving around

  # MMSI validity filter
  mmsi_min: 100000000
  mmsi_max: 999999999

  # Draught join: how far before/after a stop to look for type 5 messages
  draught_lookup_hours: 6

  # Type-5 messages carry draught, destination and ship_type. In a file from
  # scripts/convert_aisdk_csv.py they are ~99% of the rows (the DMA export puts
  # voyage data on nearly every record), so they dominate Phase 1's shuffle —
  # 43M of 63M rows on a one-day Danish extract, holding only ~12k distinct
  # values. Switching this off leaves draught and destination empty but keeps
  # ship_type, which is rebuilt from a cheap per-MMSI aggregate that never
  # leaves the JVM. Meant for running Phase 1 on a workstation:
  #   PHASE1__USE_TYPE5_DATA=false python run.py phase1
  # Leave it true in production.
  use_type5_data: true

phase2:
  h3_resolution: 11
  # Per-cell noise floor only (res-11 cells are ~50 m across — single berths
  # rarely collect many distinct vessels). The real harbour-level vessel
  # threshold is phase3.min_unique_mmsi_per_cluster.
  min_unique_mmsi: 2

phase3:
  # cluster-level thresholds
  min_cells_per_harbour: 1
  min_events_per_cluster: 5
  # Minimum distinct vessels across the whole cluster (exact count, computed
  # by re-joining stops.parquet). This is where "is it a harbour?" is decided.
  min_unique_mmsi_per_cluster: 4
  # Hot cells whose parent cells at this resolution are identical or adjacent
  # end up in the same cluster. Res 9 parents are ~350 m across — bridges the
  # cold-cell gaps between terminals of one harbour complex. Set to null to
  # fall back to fine-cell ring search via cluster_ring_size.
  connectivity_resolution: 9
  # Legacy fallback (used only when connectivity_resolution is null): how many
  # H3 rings to look outward when connecting hot cells.
  cluster_ring_size: 3
  # Connectivity above is decided on res-9 parents, so two cells hundreds of
  # metres apart join one cluster whenever their parents touch. That admits the
  # odd speck out in the water — a stray anchoring, GPS scatter — which is then
  # exported as its own polygon part. This second pass re-checks connectivity on
  # the fine cells and drops what is left stranded.
  prune_detached_cells: true
  # How far a cell may be from the rest and still count as attached. At res 11
  # (~50 m across) two rings is ~105 m.
  detached_ring_size: 2
  # A stranded group is only dropped when it is both small AND quiet. Either
  # test alone is wrong: harbours really do have detached berths — most are
  # fragmented at single-ring adjacency, and a detached group can hold half the
  # traffic — so size alone would delete a third of all cells, while traffic
  # share alone would swallow whole outlying terminals.
  max_detached_cells: 2
  max_detached_event_share: 0.05

phase4:
  # Nearest-place lookup. Empty = the cities1000 dataset bundled with
  # reverse_geocoder, which holds nothing under 1000 people — small harbours
  # then get a town tens of km away. Build the dense file once with
  # `python3 scripts/prepare_gazetteer.py` and point this at it.
  gazetteer_path: "data/reference/geonames/places.parquet"
  # A bigger harbour needs a more significant place, so a major port is named
  # after its city rather than the hamlet on its edge. The highest tier the
  # harbour reaches applies; below the first one there is no floor at all.
  # Administrative seats (GeoNames PPLA*/PPLC) clear any floor regardless of
  # their population. Keyed on n_cells: a harbour's cell count saturates at its
  # physical footprint, while n_events grows with every day of AIS added.
  city_population_tiers:
    - {min_cells: 0,    min_population: 0}
    - {min_cells: 100,  min_population: 1000}
    - {min_cells: 1000, min_population: 15000}
  # Past this the floor is dropped and the nearest place of any size wins —
  # better a village next door than a city on the far side of a bay.
  max_city_dist_km: 50

  # Harbour outline — the H3-cell union morphologically closed (dilated then
  # eroded) so the gaps between berths close and the interior holes left by
  # untrafficked cells disappear. Exported as harbours.geojson; the exact cell
  # union is still written to harbours_cells.geojson.
  # Closing fills gaps narrower than 2× the buffer without pushing the outer
  # boundary beyond ~1 buffer past the outermost cell. At 75 m that bridges
  # ~150 m — about three res-11 cells. Raise it to merge terminals that are
  # further apart into one polygon, lower it to hug the cells more tightly.
  outline_buffer_meters: 75
  # Vertex thinning. Off by default: the outline is guaranteed to contain every
  # cell that saw traffic, and simplify is the one step that can break that —
  # it shaves the boundary inwards by up to its tolerance, and 10 m is already
  # enough to cut a whole res-11 cell out. Raise it only to shrink the output
  # (10 m is roughly 5× smaller), accepting that bite.
  outline_simplify_meters: 0
  outline_fill_holes: true         # drop interior rings

phase5:
  # ID matching thresholds
  h3_jaccard_threshold: 0.3        # minimum H3 cell overlap to match existing harbour
  centroid_match_distance_meters: 500
  existing_db_path: "data/existing_db/harbours.geojson"

spark:
  app_name: "harbour-detector"
  # Production Spark/executor settings live in deploy/spark_job.yaml (sparkConf,
  # driver/executor resources). Everything below applies to **local mode only**
  # and is skipped inside Kubernetes, where the Spark Operator supplies them.
  #
  # Spark's own defaults assume a cluster: one task thread per core — each with
  # its own Python worker holding a pandas frame — against a 1 GB driver heap
  # that in local mode is the entire JVM. That combination is what runs a
  # laptop out of memory in Phase 1.
  local_threads: 2                # task slots = concurrent Python workers
  local_driver_memory: "3g"       # JVM heap; in local mode this is everything
  local_shuffle_partitions: 64    # groupBy(mmsi) shuffle width (Spark default 200)
  local_arrow_batch_size: 5000    # rows per Arrow batch into a Python worker
  local_max_partition_bytes: "32m"  # read split size (Spark default 128m)

s3:
  # Leave blank to use environment variables or IAM instance roles.
  # Values here take precedence over environment variables.
  # Corresponding env vars: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
  #                         AWS_DEFAULT_REGION, S3_ENDPOINT_URL
  # For local credentials, copy .env.example → .env and fill it in.
  access_key_id:     ""
  secret_access_key: ""
  region:            ""   # defaults to us-east-1 when blank
  endpoint_url:      ""   # set for MinIO, e.g. http://localhost:9000

  # To route the pipeline through S3, change data.raw_glob / interim_dir /
  # output_dir to S3 URIs, e.g.:
  #   raw_glob:    "s3://my-bucket/ais/**/*.parquet"
  #   interim_dir: "s3://my-bucket/harbour-detector/interim"
  #   output_dir:  "s3://my-bucket/harbour-detector/output"

gui:
  output_file: "data/output/harbours.geojson"
  # H3-cell companion file behind the map's "H3 cells" / "Both" toggle.
  # Defaults to output_file with a '_cells' suffix when left unset.
  cells_file: "data/output/harbours_cells.geojson"
  default_tile: "OpenStreetMap"
  map_tiles:
    - name: "OpenStreetMap"
      url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
      attribution: "© <a href='https://www.openstreetmap.org/copyright'>OpenStreetMap</a> contributors"
    - name: "CartoDB Positron"
      url: "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png"
      attribution: "© <a href='https://carto.com/'>CARTO</a>"
    - name: "CartoDB Dark"
      url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
      attribution: "© <a href='https://carto.com/'>CARTO</a>"
    - name: "Esri Satellite"
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      attribution: "© Esri, Maxar, Earthstar Geographics"
    # Add custom tile servers here, e.g.:
    # - name: "My Server"
    #   url: "https://mytiles.example.com/{z}/{x}/{y}.png"
    #   attribution: "© My Company"
    #
    # Offline: replace the four public entries above with your own server —
    # leaving them in costs a DNS timeout every time one is selected.

  # Offline deployments: serve Leaflet/Leaflet.Draw from static/vendor/ instead
  # of the public CDNs. Run scripts/vendor_map_assets.py first to fill it.
  # Overridable with GUI__LOCAL_MAP_ASSETS=true.
  local_map_assets: false
  # Where those files are served from. The default is this app's own static
  # directory; point it elsewhere (e.g. "https://maps.internal/leaflet") to
  # serve them from the same host as the tiles.
  # map_assets_url: "/app/static/vendor"
