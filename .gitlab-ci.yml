stages:
  - lint
  - test

default:
  image: python:3.12-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# ── Lint ──────────────────────────────────────────────────────────────────────

lint:
  stage: lint
  cache:
    key: pip-lint
    paths:
      - .cache/pip
  script:
    - pip install ruff
    - ruff check .

# ── Test ──────────────────────────────────────────────────────────────────────

test:
  stage: test
  cache:
    key: pip-test
    paths:
      - .cache/pip
  before_script:
    # test_phase1.py's end-to-end tests start a real SparkSession, and
    # python:3.12-slim ships no JVM — without this they error, not skip.
    - apt-get update && apt-get install -y --no-install-recommends default-jdk-headless
    - pip install -r requirements.txt
  script:
    - pytest
